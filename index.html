<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Генератор кибер-сигилов в стиле cybersigilism: симметричные шипастые узоры, экспорт PNG и SVG.">
<title>Sigil Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane workbench — square sigil stage on the left, instrument rail on the right; stacks on phones.
   Single dark theme by choice: the tool is a darkroom around the canvas, whose own palette is set per style. */
:root{
  --bg:#0a0b0e;
  --panel:#111318;
  --line:#22252d;
  --fg:#e3e6eb;
  --muted:#838997;
  --chrome:#d3d9e1;
  --chrome-deep:#5d646f;
  --f-display:"Pirata One","UnifrakturMaguntia",Georgia,serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{
  font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 32px;
}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;max-width:1240px;margin:0 auto 18px}
.mark{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mark h1{
  margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1;letter-spacing:.01em;
  background:linear-gradient(175deg,#fff 0%,#9aa2ad 38%,#f2f5f8 52%,#4b525c 70%,#dfe5ec 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.mark .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.readout{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.readout b{color:var(--fg);font-weight:500}

.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;max-width:1240px;margin:0 auto;align-items:start}
.stage{min-width:0;display:flex;flex-direction:column;gap:12px}
.frame{
  position:relative;width:min(100%,calc(100vh - 150px));min-width:min(100%,360px);aspect-ratio:1;max-width:100%;
  margin:0 auto;background:#000;
}
.frame.transparent{background:repeating-conic-gradient(#1b1d22 0 25%,#121418 0 50%) 0 0/22px 22px}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame::before,.frame::after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--chrome-deep);pointer-events:none;z-index:1}
.frame::before{top:-7px;left:-7px;border-right:0;border-bottom:0}
.frame::after{bottom:-7px;right:-7px;border-left:0;border-top:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;width:min(100%,calc(100vh - 150px));min-width:min(100%,360px);max-width:100%;margin:0 auto}
.history{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;width:min(100%,calc(100vh - 150px));min-width:min(100%,360px);max-width:100%;margin:0 auto}
.history button{flex:0 0 auto;width:64px;height:64px;padding:0;border:1px solid var(--line);background:#000;cursor:pointer;position:relative}
.history button[aria-current="true"]{border-color:var(--chrome)}
.history canvas{width:100%;height:100%;display:block}
.history:empty::before{content:"Здесь появятся предыдущие сигилы";font-size:12px;color:var(--muted);padding:20px 0}

.rail{background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:20px;min-width:0}
.group{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.btn{
  font:500 13px/1 var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);
  padding:11px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,background .15s
}
.btn:hover{border-color:var(--chrome-deep);background:#171a20}
.btn.primary{
  color:#0b0c0f;border-color:transparent;font-weight:600;font-size:14px;padding:14px;
  background:linear-gradient(170deg,#fbfcfd 0%,#a6aeb9 40%,#eef2f6 55%,#7c848f 100%);
}
.btn.primary:hover{filter:brightness(1.07)}
.btn kbd{font-family:var(--f-mono);font-size:10px;font-weight:500;border:1px solid currentColor;opacity:.6;padding:2px 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
:focus-visible{outline:1px solid var(--chrome);outline-offset:2px}

.seed{display:flex;gap:8px}
.seed input{
  flex:1;min-width:0;font:500 14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);
  background:#0b0c10;border:1px solid var(--line);padding:9px 10px
}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:500 12px/1 var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);padding:8px 10px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px
}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--chrome)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid #ffffff22;flex:0 0 auto}

.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.slider label{font-size:13px}
.slider output{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.slider input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:linear-gradient(90deg,var(--chrome-deep),var(--line))}
input[type=range]::-moz-range-track{height:1px;background:linear-gradient(90deg,var(--chrome-deep),var(--line))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;background:var(--chrome);transform:rotate(45deg);border:0}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--chrome);transform:rotate(45deg);border:0;border-radius:0}

.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.tg input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:1px solid var(--chrome-deep);transform:rotate(45deg);margin:0 2px;cursor:pointer;flex:0 0 auto}
.tg input:checked{background:var(--chrome);border-color:var(--chrome)}

.hint{font-size:12px;color:var(--muted);margin:0}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:#1a1d23;border:1px solid var(--chrome-deep);color:var(--fg);font-size:13px;padding:9px 14px;z-index:20;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)
}
.toast.on{opacity:1}

@media (max-width:860px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .frame,.meta,.history{width:100%;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<header class="top">
  <div class="mark">
    <h1>Sigil Forge</h1>
    <span class="sub">cybersigilism · генератор</span>
  </div>
  <div class="readout" id="readout">seed <b>—</b></div>
</header>

<main class="bench">
  <section class="stage" aria-label="Холст">
    <div class="frame" id="frame"><canvas id="cv" role="img" aria-label="Сгенерированный сигил"></canvas></div>
    <div class="meta"><span id="stats">—</span><span>Пробел — новый · M — мутация</span></div>
    <div class="history" id="hist" aria-label="История"></div>
  </section>

  <aside class="rail" aria-label="Параметры">
    <div class="group">
      <button class="btn primary" id="btnNew" type="button">Новый сигил <kbd>Space</kbd></button>
      <div class="row">
        <button class="btn" id="btnMut" type="button">Мутация <kbd>M</kbd></button>
        <button class="btn" id="btnReplay" type="button">Повтор роста</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Seed</span>
      <form class="seed" id="seedForm">
        <input id="seedIn" maxlength="24" spellcheck="false" autocomplete="off" aria-label="Seed">
        <button class="btn" type="submit">Применить</button>
      </form>
    </div>

    <div class="group">
      <span class="label">Симметрия</span>
      <div class="chips" id="symChips"></div>
    </div>

    <div class="group">
      <span class="label">Материал</span>
      <div class="chips" id="styleChips"></div>
    </div>

    <div class="group" id="sliders"></div>

    <div class="group">
      <span class="label">Слои</span>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="tSpine">Хребет</label>
        <label class="tg"><input type="checkbox" id="tOrbits">Орбиты</label>
        <label class="tg"><input type="checkbox" id="tSparks">Искры</label>
        <label class="tg"><input type="checkbox" id="tTransparent">Без фона</label>
      </div>
    </div>

    <div class="group" id="exportGroup">
      <span class="label">Экспорт</span>
      <div class="row3">
        <button class="btn" id="btnPng" type="button">PNG</button>
        <button class="btn" id="btnSvg" type="button">SVG</button>
        <button class="btn" id="btnCopy" type="button">Копия SVG</button>
      </div>
      <p class="hint">PNG 2048×2048. SVG векторный — годится для трафарета тату и печати.</p>
    </div>
  </aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ---------- materials ---------- */
const STYLES = {
  chrome: { name: "Хром",    bg: "#050608", chrome: true, glow: "rgba(190,215,255,.22)", glowR: .006, sw: ["#050608", "#cfd6df"] },
  ink:    { name: "Чернила", bg: "#e7e3db", fill: "#0c0c0f", sw: ["#e7e3db", "#0c0c0f"] },
  blood:  { name: "Кровь",   bg: "#0a0405", fill: "#c4132b", glow: "rgba(255,25,55,.55)", glowR: .010, sw: ["#0a0405", "#c4132b"] },
  neon:   { name: "Неон",    bg: "#03060b", fill: "#eafdff", glow: "rgba(0,215,255,.95)", glowR: .013, sw: ["#03060b", "#41e3ff"] },
  bone:   { name: "Кость",   bg: "#050505", fill: "#eee8dc", sw: ["#050505", "#eee8dc"] },
  skin:   { name: "Тату",    bg: "#d9b49c", fill: "#16100e", sw: ["#d9b49c", "#16100e"] },
};
const CHROME_STOPS = [[0,"#ffffff"],[.16,"#8a929d"],[.3,"#f5f8fb"],[.43,"#363c45"],[.56,"#dae1e9"],[.7,"#69717c"],[.84,"#fcfdff"],[1,"#545b65"]];
const SYMS = [["mirror","Зеркало"],["r3","×3"],["r4","×4"],["r5","×5"],["r6","×6"],["r8","×8"],["none","Нет"]];
const SLIDERS = [
  ["density", "Плотность", 3, 16, 1, v => v],
  ["spikes",  "Шипы",      0, 100, 1, v => v + "%"],
  ["curl",    "Завитки",   0, 100, 1, v => v + "%"],
  ["chaos",   "Хаос",      0, 100, 1, v => v + "%"],
  ["weight",  "Толщина",   40, 220, 5, v => v + "%"],
];
const DEFAULTS = { density: 8, spikes: 55, curl: 60, chaos: 45, weight: 100, sym: "mirror", style: "chrome",
                   spine: true, orbits: true, sparks: true, transparent: false };

/* ---------- seeded randomness ---------- */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rngFrom(str) {
  const r = mulberry32(xmur3(str)());
  const f = () => r();
  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  f.sign = () => r() < .5 ? -1 : 1;
  f.chance = p => r() < p;
  f.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * r()); };
  return f;
}
const SEED_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newSeed() {
  let s = "";
  for (let i = 0; i < 8; i++) { s += SEED_ABC[Math.floor(Math.random() * SEED_ABC.length)]; if (i === 3) s += "-"; }
  return s;
}

/* ---------- geometry ---------- */
const PROF = {
  swoosh:  t => Math.pow(Math.sin(Math.PI * Math.pow(t, .55)), 1.1),
  thorn:   t => Math.pow(1 - t, 1.15),
  diamond: t => 1 - Math.abs(2 * t - 1),
  hair:    t => Math.pow(Math.sin(Math.PI * t), .5),
};
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const SPEED = .55;

// Builds one symmetry cell ("motif"). Main structure draws from R, branches and thorns from D,
// so a mutation (new variant → new D) keeps the skeleton and regrows the barbs.
function buildMotif(seed, variant, P) {
  const R = rngFrom(seed), D = rngFrom(seed + "/" + variant);
  const chaos = P.chaos / 100, curl = P.curl / 100, spikes = P.spikes / 100, wk = P.weight / 100;
  const radial = P.sym[0] === "r", folds = radial ? +P.sym.slice(1) : 1, free = P.sym === "none";
  const out = [];

  function bent(r, x0, y0, x1, y1, w, prof, t0, dur, n, bend) {
    const mx = (x0 + x1) / 2 - (y1 - y0) * bend, my = (y0 + y1) / 2 + (x1 - x0) * bend;
    const pts = [], ws = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([u * u * x0 + 2 * u * t * mx + t * t * x1, u * u * y0 + 2 * u * t * my + t * t * y1]);
      ws.push(w * prof(t));
    }
    out.push({ pts, ws, t0, dur });
  }

  function tendril(r, x, y, ang, len, w, depth, t0, opt = {}) {
    const prof = opt.prof || PROF.swoosh, ch = opt.chaos ?? chaos, cu = opt.curl ?? curl;
    const step = .009, n = Math.max(6, Math.round(len / step));
    const pts = [], ws = [], angs = [];
    let curv = r.range(-1, 1) * .03 * ch;
    const dir = r.sign(), zone = r.range(.22, .45), amt = cu * r.range(.5, 1.5);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push([x, y]); ws.push(w * prof(t)); angs.push(ang);
      curv += r.gauss() * .005 * ch; curv *= .955;
      let c = curv;
      if (t > 1 - zone) { const k = (t - (1 - zone)) / zone; c += dir * amt * .11 * k * k; }
      const rad = Math.hypot(x, y);
      if (rad > .8) c += wrapA(Math.atan2(-y, -x) - ang) * .1 * (rad - .8) / .2;
      ang += c; x += Math.cos(ang) * step; y += Math.sin(ang) * step;
    }
    const dur = (.35 + len * .7) * SPEED;
    out.push({ pts, ws, t0, dur });
    if (opt.bare) return;

    if (depth < 2) {
      const nb = Math.round(spikes * len * (depth ? 2.2 : 4) * D.range(.4, 1.2));
      for (let b = 0; b < nb; b++) {
        const ti = D.range(.12, .7), i = Math.round(ti * n);
        tendril(D, pts[i][0], pts[i][1], angs[i] + D.sign() * D.range(.35, 1.15),
                len * D.range(.22, .5), ws[i] * D.range(.5, .85), depth + 1, t0 + dur * ti);
      }
    }
    const nt = Math.round(spikes * len * (depth ? 6 : 11) * D.range(.5, 1.3));
    for (let k = 0; k < nt; k++) {
      const ti = D.range(.08, .85), i = Math.round(ti * n);
      if (ws[i] < .002) continue;
      const side = D.sign(), back = D.chance(.18);
      const a = angs[i] + (back ? Math.PI : 0) + side * (back ? -1 : 1) * D.range(.45, 1.0);
      const L = ws[i] * D.range(1.6, 4.2) + .012;
      bent(D, pts[i][0], pts[i][1], pts[i][0] + Math.cos(a) * L, pts[i][1] + Math.sin(a) * L,
           ws[i] * D.range(.75, 1.1), PROF.thorn, t0 + dur * ti, .12, 6, side * D.range(0, .22));
    }
  }

  // spine: the axis everything hangs from
  if (P.spine && !free) {
    const W = .026 * wk * R.range(.8, 1.3), bul = R.int(2, 5), n = 140, pts = [], ws = [];
    const y0 = radial ? -.05 : -R.range(.8, .94), y1 = radial ? -R.range(.82, .94) : R.range(.8, .94);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push([0, y0 + (y1 - y0) * t]);
      ws.push(W * Math.pow(Math.sin(Math.PI * t), .6) * (.3 + .7 * Math.pow(Math.abs(Math.cos(Math.PI * t * bul)), 4)));
    }
    out.push({ pts, ws, t0: 0, dur: .9 * SPEED });
    const nd = R.int(1, 3);
    for (let k = 0; k < nd; k++) {
      const cy = radial ? -R.range(.2, .75) : R.range(-.6, .6), h = R.range(.05, .16);
      bent(R, 0, cy - h, 0, cy + h, R.range(.03, .07) * wk, PROF.diamond, .15 + k * .08, .3 * SPEED, 16, 0);
      if (R.chance(.6)) bent(R, 0, cy, R.range(.08, .26), cy + R.range(-.03, .03), R.range(.008, .016) * wk, PROF.thorn, .3, .25 * SPEED, 14, R.range(-.15, .15));
    }
  }

  // main tendrils
  const N = radial ? Math.max(2, Math.round(P.density * .55)) : P.density;
  for (let i = 0; i < N; i++) {
    let x, y, a, len = R.range(.35, 1.0);
    const w = R.range(.016, .04) * wk, t0 = i * .06;
    if (free) {
      x = R.range(-.45, .45); y = R.range(-.6, .6); a = R.range(-Math.PI, Math.PI);
    } else if (radial) {
      x = R.range(0, .03); y = -R.range(.06, .6); a = -Math.PI / 2 + R.range(.15, Math.min(1.4, Math.PI / folds * 1.7)); len *= .65;
    } else if (R.chance(.32)) {
      x = R.range(.06, .38); y = R.range(-.5, .5); a = R.sign() * Math.PI / 2 + R.range(-.45, .45); len *= 1.15;
    } else {
      x = R.range(0, .05); y = R.range(-.78, .78); a = R.range(-1.25, 1.25);
    }
    tendril(R, x, y, a, len, w, 0, t0);
  }

  // hairlines: long thin strands that cut across the mass
  const nh = R.int(1, 3);
  for (let i = 0; i < nh; i++) {
    const x = free ? R.range(-.3, .3) : R.range(0, .2), y = radial ? -R.range(.1, .5) : R.range(-.4, .4);
    const a = radial ? -Math.PI / 2 + R.range(.1, Math.PI / folds) : (free ? R.range(-Math.PI, Math.PI) : R.range(-1.4, 1.4));
    tendril(R, x, y, a, R.range(.5, 1.1) * (radial ? .7 : 1), .0045 * wk * R.range(.7, 1.4), 2, .2 + i * .1,
            { prof: PROF.hair, chaos: chaos * .4, curl: curl * .5, bare: true });
  }

  // orbits: broken halo arcs with outward ticks
  if (P.orbits) {
    const no = R.int(1, 2);
    for (let o = 0; o < no; o++) {
      const rr = R.range(.3, .85);
      let a0, a1;
      if (radial) { a0 = -Math.PI / 2 + R.range(0, .15); a1 = -Math.PI / 2 + Math.PI / folds * R.range(.6, 1); }
      else if (free) { a0 = R.range(-Math.PI, Math.PI); a1 = a0 + R.range(1, 3); }
      else { a0 = -Math.PI / 2 + R.range(-.05, .5); a1 = Math.min(Math.PI / 2 + .05, a0 + R.range(.6, 2.2)); }
      const n = 90, pts = [], ws = [], wo = .006 * wk * R.range(.6, 1.6);
      for (let i = 0; i <= n; i++) { const t = i / n, aa = a0 + (a1 - a0) * t; pts.push([Math.cos(aa) * rr, Math.sin(aa) * rr]); ws.push(wo * PROF.hair(t)); }
      out.push({ pts, ws, t0: .25 + o * .15, dur: .8 * SPEED });
      const nt = R.int(1, 4);
      for (let k = 0; k < nt; k++) {
        const aa = a0 + (a1 - a0) * R.range(.15, .85), L = R.range(.03, .09);
        bent(R, Math.cos(aa) * rr, Math.sin(aa) * rr, Math.cos(aa) * (rr + L), Math.sin(aa) * (rr + L),
             wo * 2.4, PROF.thorn, .5, .15, 6, R.range(-.1, .1));
      }
    }
  }

  // sparks: four-point glints
  if (P.sparks) {
    const ns = R.int(2, 6);
    for (let s = 0; s < ns; s++) {
      let x, y;
      if (radial) { const rr = R.range(.25, .88), aa = -Math.PI / 2 + R.range(.05, Math.PI / folds); x = Math.cos(aa) * rr; y = Math.sin(aa) * rr; }
      else if (free) { x = R.range(-.85, .85); y = R.range(-.85, .85); }
      else { x = R.range(.12, .85); y = R.range(-.85, .85); }
      if (Math.hypot(x, y) > .92) continue;
      const sz = R.range(.025, .085), w = sz * .24, t0 = .4 + s * .07;
      bent(R, x, y - sz, x, y + sz, w, PROF.diamond, t0, .2, 12, 0);
      bent(R, x - sz * .6, y, x + sz * .6, y, w * .9, PROF.diamond, t0, .2, 12, 0);
    }
  }
  return out;
}

function applySymmetry(motif, sym) {
  if (sym === "none") return motif;
  let all = motif.concat(motif.map(s => ({ ...s, flip: true, pts: s.pts.map(([x, y]) => [-x, y]) })));
  if (sym[0] === "r") {
    const f = +sym.slice(1), res = [];
    for (let k = 0; k < f; k++) {
      const th = 2 * Math.PI * k / f, c = Math.cos(th), s = Math.sin(th);
      for (const st of all) res.push({ ...st, pts: st.pts.map(([x, y]) => [x * c - y * s, x * s + y * c]) });
    }
    all = res;
  }
  return all;
}

function prepare(st) {
  const n = st.pts.length, p = new Float32Array(n * 2), nx = new Float32Array(n), ny = new Float32Array(n);
  for (let i = 0; i < n; i++) { p[2 * i] = st.pts[i][0]; p[2 * i + 1] = st.pts[i][1]; }
  for (let i = 0; i < n; i++) {
    const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
    const dx = p[2 * b] - p[2 * a], dy = p[2 * b + 1] - p[2 * a + 1], l = Math.hypot(dx, dy) || 1;
    nx[i] = -dy / l; ny[i] = dx / l;
  }
  return { n, p, nx, ny, w: Float32Array.from(st.ws), t0: st.t0, dur: Math.max(.05, st.dur), flip: !!st.flip };
}

function build(seed, variant, P) {
  const strokes = applySymmetry(buildMotif(seed, variant, P), P.sym).map(prepare);
  let end = 0;
  for (const s of strokes) end = Math.max(end, s.t0 + s.dur);
  return { strokes, end };
}

/* ---------- rendering ---------- */
// Traces a tapered stroke as a closed outline. While growing, the head narrows to a point.
function trace(path, st, prog, c, k) {
  const last = st.n - 1;
  const m = prog >= 1 ? last : Math.floor(prog * last);
  if (m < 1) return;
  const { p, nx, ny, w } = st, sg = st.flip ? -1 : 1;
  const head = i => prog >= 1 ? 1 : Math.min(1, (m - i) / 6);
  for (let i = 0; i <= m; i++) {
    const h = w[i] * .5 * sg * head(i), x = c + (p[2 * i] + nx[i] * h) * k, y = c + (p[2 * i + 1] + ny[i] * h) * k;
    i ? path.lineTo(x, y) : path.moveTo(x, y);
  }
  for (let i = m; i >= 0; i--) {
    const h = -w[i] * .5 * sg * head(i);
    path.lineTo(c + (p[2 * i] + nx[i] * h) * k, c + (p[2 * i + 1] + ny[i] * h) * k);
  }
  path.closePath();
}

function paint(ctx, size, model, P, time, transparent) {
  const S = STYLES[P.style], c = size / 2, k = size / 2 * .94;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, size, size);
  if (!transparent) { ctx.fillStyle = S.bg; ctx.fillRect(0, 0, size, size); }
  const path = new Path2D();
  for (const st of model.strokes) {
    const prog = time === Infinity ? 1 : (time - st.t0) / st.dur;
    if (prog > 0) trace(path, st, Math.min(1, prog), c, k);
  }
  if (S.glow) {
    ctx.save();
    ctx.filter = `blur(${Math.max(1.5, size * S.glowR)}px)`;
    ctx.fillStyle = S.glow;
    ctx.fill(path); ctx.fill(path);
    ctx.restore();
  }
  if (S.chrome) {
    const g = ctx.createLinearGradient(0, 0, size * .35, size);
    for (const [o, col] of CHROME_STOPS) g.addColorStop(o, col);
    ctx.fillStyle = g;
  } else ctx.fillStyle = S.fill;
  ctx.fill(path);
}

function toSVG(model, P) {
  const S = STYLES[P.style], Z = 1000, c = Z / 2, k = Z / 2 * .94;
  let d = "";
  const f = v => v.toFixed(1);
  for (const st of model.strokes) {
    const { p, nx, ny, w, n } = st, sg = st.flip ? -1 : 1;
    for (let i = 0; i < n; i++) { const h = w[i] * .5 * sg; d += (i ? "L" : "M") + f(c + (p[2 * i] + nx[i] * h) * k) + " " + f(c + (p[2 * i + 1] + ny[i] * h) * k); }
    for (let i = n - 1; i >= 0; i--) { const h = -w[i] * .5 * sg; d += "L" + f(c + (p[2 * i] + nx[i] * h) * k) + " " + f(c + (p[2 * i + 1] + ny[i] * h) * k); }
    d += "Z";
  }
  let defs = "", body = "";
  if (S.chrome) defs += `<linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${Z * .35}" y2="${Z}">` +
    CHROME_STOPS.map(([o, col]) => `<stop offset="${o}" stop-color="${col}"/>`).join("") + `</linearGradient>`;
  if (S.glow) {
    defs += `<filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${(Z * S.glowR * .5).toFixed(2)}"/></filter>`;
    body += `<path d="${d}" fill="${S.glow}" filter="url(#glow)"/>`;
  }
  body += `<path d="${d}" fill="${S.chrome ? "url(#chrome)" : S.fill}"/>`;
  const bg = P.transparent ? "" : `<rect width="${Z}" height="${Z}" fill="${S.bg}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Z} ${Z}" width="${Z}" height="${Z}">` +
    (defs ? `<defs>${defs}</defs>` : "") + bg + body + `</svg>`;
}

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d"), frame = $("#frame");
let P = { ...DEFAULTS };
try { const saved = JSON.parse(localStorage.getItem("sigil-forge-params") || "null"); if (saved) P = { ...DEFAULTS, ...saved }; } catch (e) {}
let seed = newSeed(), variant = 0, model = null, history = [], anim = 0, animStart = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function persist() { try { localStorage.setItem("sigil-forge-params", JSON.stringify(P)); } catch (e) {} }

function canvasSize() {
  const css = cv.clientWidth || 600, dpr = Math.min(2, window.devicePixelRatio || 1);
  return Math.round(css * dpr);
}
function draw(time) {
  const size = canvasSize();
  if (cv.width !== size) { cv.width = size; cv.height = size; }
  paint(ctx, size, model, P, time, P.transparent);
}
function play(animate) {
  cancelAnimationFrame(anim);
  if (!animate || reduceMotion) { anim = 0; draw(Infinity); return; }
  animStart = performance.now();
  const tick = now => {
    const t = (now - animStart) / 1000;
    if (t >= model.end) { anim = 0; draw(Infinity); return; }
    draw(t); anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
}

const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
function updateReadout() {
  $("#readout").innerHTML = `seed <b>${seed}</b> · вариант <b>${variant}</b>`;
  $("#seedIn").value = seed;
  const n = model.strokes.length, sym = SYMS.find(s => s[0] === P.sym)[1];
  $("#stats").textContent = `${n} ${plural(n, "штрих", "штриха", "штрихов")} · симметрия ${sym.toLowerCase()} · ${STYLES[P.style].name.toLowerCase()}`;
  frame.classList.toggle("transparent", P.transparent);
}

function regenerate(animate) {
  model = build(seed, variant, P);
  updateReadout();
  play(animate);
}

/* ---------- history ---------- */
function thumb(entry) {
  const c = document.createElement("canvas"), s = 128;
  c.width = c.height = s;
  paint(c.getContext("2d"), s, entry.model, entry.P, Infinity, false);
  return c;
}
function pushHistory() {
  history.unshift({ seed, variant, P: { ...P }, model });
  history = history.slice(0, 14);
  renderHistory();
}
function refreshHead() {
  if (!history.length) return;
  Object.assign(history[0], { seed, variant, P: { ...P }, model });
  renderHistory();
}
function renderHistory() {
  const box = $("#hist");
  box.textContent = "";
  history.forEach((h, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.title = `${h.seed} · вариант ${h.variant}`;
    b.setAttribute("aria-label", `Вернуть сигил ${h.seed}, вариант ${h.variant}`);
    b.setAttribute("aria-current", i === 0 ? "true" : "false");
    b.appendChild(thumb(h));
    b.addEventListener("click", () => {
      const [e] = history.splice(i, 1);
      history.unshift(e);
      seed = e.seed; variant = e.variant; P = { ...e.P }; model = e.model;
      syncControls(); updateReadout(); renderHistory(); persist(); play(false);
    });
    box.appendChild(b);
  });
}

/* ---------- controls ---------- */
function chipGroup(box, items, key, swatch) {
  box.textContent = "";
  for (const [val, label] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.val = val;
    if (swatch) {
      const sw = document.createElement("span"); sw.className = "sw";
      sw.style.background = `linear-gradient(135deg, ${swatch(val)[0]} 50%, ${swatch(val)[1]} 50%)`;
      b.appendChild(sw);
    }
    b.appendChild(document.createTextNode(label));
    b.addEventListener("click", () => { P[key] = val; persist(); syncControls(); onParam(key === "sym"); });
    box.appendChild(b);
  }
}
chipGroup($("#symChips"), SYMS, "sym");
chipGroup($("#styleChips"), Object.entries(STYLES).map(([k, s]) => [k, s.name]), "style", v => STYLES[v].sw);

const sliderBox = $("#sliders");
for (const [key, label, min, max, step, fmt] of SLIDERS) {
  const wrap = document.createElement("div"); wrap.className = "slider";
  wrap.innerHTML = `<label for="s-${key}">${label}</label><output id="o-${key}" for="s-${key}"></output>` +
    `<input type="range" id="s-${key}" min="${min}" max="${max}" step="${step}">`;
  sliderBox.appendChild(wrap);
  const inp = wrap.querySelector("input");
  inp.addEventListener("input", () => { P[key] = +inp.value; $("#o-" + key).textContent = fmt(P[key]); onParam(false); });
  inp.addEventListener("change", persist);
}
const TOGGLES = { tSpine: "spine", tOrbits: "orbits", tSparks: "sparks", tTransparent: "transparent" };
for (const [id, key] of Object.entries(TOGGLES)) {
  $("#" + id).addEventListener("change", e => { P[key] = e.target.checked; persist(); onParam(key !== "transparent"); });
}

function syncControls() {
  for (const [key, , , , , fmt] of SLIDERS) { $("#s-" + key).value = P[key]; $("#o-" + key).textContent = fmt(P[key]); }
  for (const [id, key] of Object.entries(TOGGLES)) $("#" + id).checked = !!P[key];
  document.querySelectorAll("#symChips .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.val === P.sym));
  document.querySelectorAll("#styleChips .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.val === P.style));
}

// Parameter edits rebuild the same seed; a rAF gate keeps slider drags smooth.
let pending = 0, pendingAnim = false;
function onParam(animate) {
  pendingAnim = pendingAnim || animate;
  if (pending) return;
  pending = requestAnimationFrame(() => {
    pending = 0;
    regenerate(pendingAnim); pendingAnim = false;
    clearTimeout(onParam.t); onParam.t = setTimeout(refreshHead, 250);
  });
}

function fresh() { seed = newSeed(); variant = 0; regenerate(true); pushHistory(); }
function mutate() { variant++; regenerate(true); pushHistory(); }

$("#btnNew").addEventListener("click", fresh);
$("#btnMut").addEventListener("click", mutate);
$("#btnReplay").addEventListener("click", () => play(true));
$("#seedForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#seedIn").value.trim().toUpperCase();
  if (!v) { toast("Введите seed: любые буквы и цифры"); return; }
  seed = v; variant = 0; regenerate(true); pushHistory();
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "button" || tag === "select") return;
  if (e.code === "Space") { e.preventDefault(); fresh(); }
  else if (e.code === "KeyM") mutate();
});

/* ---------- export ---------- */
const toastEl = $("#toast");
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("on"), 2600); }

const inViewer = !!(window.claude && window.claude.use);
let downloads = null;
if (inViewer) {
  (async () => {
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    if (!downloads) { $("#btnPng").hidden = true; $("#btnSvg").hidden = true; $(".row3").style.gridTemplateColumns = "1fr"; }
  })();
}
async function offerFile(filename, blob) {
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); toast("Сохранено: " + filename); }
    catch (e) {
      if (e && e.code === "declined") toast("Сохранение отменено");
      else if (e && e.code === "rate_limited") toast("Окно сохранения уже открыто");
      else toast("Сохранить не получилось. Попробуйте «Копия SVG».");
    }
  } else if (!inViewer) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
}
const fileBase = () => `sigil-${seed}${variant ? "-v" + variant : ""}`;
$("#btnPng").addEventListener("click", () => {
  const c = document.createElement("canvas"); c.width = c.height = 2048;
  paint(c.getContext("2d"), 2048, model, P, Infinity, P.transparent);
  c.toBlob(b => b ? offerFile(fileBase() + ".png", b) : toast("Не удалось собрать PNG"), "image/png");
});
$("#btnSvg").addEventListener("click", () => offerFile(fileBase() + ".svg", new Blob([toSVG(model, P)], { type: "image/svg+xml" })));
$("#btnCopy").addEventListener("click", () => {
  const svg = toSVG(model, P);
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = svg; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    toast(ok ? "SVG скопирован" : "Буфер обмена недоступен в этом окне");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(svg).then(() => toast("SVG скопирован"), fallback);
  else fallback();
});

/* ---------- boot ---------- */
new ResizeObserver(() => { if (model && !anim) draw(Infinity); }).observe(frame);
syncControls();
regenerate(true);
pushHistory();
})();
</script>
</body>
</html>
